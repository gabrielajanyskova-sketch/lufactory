<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lufactory — Administrace</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap"></noscript>
<style>
/* ==========================================================================
   lufactory.cz — design tokens
   ========================================================================== */
:root {
  --brown: #81665b;
  --brown-dark: #6b544b;
  --cream: #faf6ef;
  --cream-dark: #f1e8d6;
  --ink: #2e2419;
  --text: #4a4038;
  --text-muted: #786b58;
  --white: #ffffff;
  --border: #e6dcc8;
  --sage: #7a8b52;
  --sage-dark: #5b6a3d;
  --font-body: 'Poppins', system-ui, sans-serif;
  --font-heading: 'Cormorant Garamond', Georgia, serif;
  --radius: 16px;
  --shadow: 0 10px 30px -12px rgba(46, 36, 25, 0.2);
  --max-width: 1180px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
html { scroll-behavior: smooth; }
html, body { overflow-x: hidden; max-width: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--text);
  background: var(--white);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; margin: 0; padding: 0; }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3 { color: var(--ink); line-height: 1.25; margin: 0 0 0.5em; font-weight: 600; font-family: var(--font-heading); }
p { margin: 0 0 1em; }

.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

.script {
  font-family: var(--font-heading);
  font-style: italic;
  color: var(--brown);
  font-weight: 500;
}

.eyebrow {
  display: inline-block;
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brown);
  font-weight: 600;
  margin-bottom: 12px;
}

.btn {
  display: inline-block;
  padding: 14px 32px;
  border-radius: 999px;
  background: var(--brown);
  color: var(--white);
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
  transition: background 0.2s ease, transform 0.2s ease;
}
.btn:hover { background: var(--brown-dark); transform: translateY(-1px); }
.btn--outline {
  background: transparent;
  border: 1.5px solid var(--brown);
  color: var(--brown);
}
.btn--outline:hover { background: var(--brown); color: var(--white); }

/* ---------- header ---------- */
.site-header {
  padding: 18px 0;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.site-header .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.logo { display: flex; align-items: center; }
.logo img {
  height: 44px;
  width: auto;
  display: block;
}
.main-nav ul { display: flex; gap: 28px; }
.main-nav a {
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text);
}
.main-nav a:hover { color: var(--brown); }
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-toggle {
  display: none;
  background: none;
  border: 0;
  padding: 6px;
}
.nav-toggle-icon,
.nav-toggle-icon::before,
.nav-toggle-icon::after {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--ink);
  position: relative;
  transition: transform 0.2s ease;
}
.nav-toggle-icon::before { content: ''; position: absolute; top: -7px; width: 24px; }
.nav-toggle-icon::after { content: ''; position: absolute; top: 7px; width: 24px; }

/* ---------- cart toggle ---------- */
.cart-toggle {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: 0;
  background: none;
  color: var(--ink);
}
.cart-toggle svg { width: 22px; height: 22px; }
.cart-count {
  position: absolute;
  top: 2px;
  right: 2px;
  background: var(--brown);
  color: var(--white);
  font-size: 0.7rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* ---------- cart panel ---------- */
.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(46, 36, 25, 0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 90;
}
.cart-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 380px;
  max-width: 92vw;
  background: var(--white);
  box-shadow: var(--shadow);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  display: flex;
  flex-direction: column;
}
body.cart-open .cart-overlay { opacity: 1; pointer-events: auto; }
body.cart-open .cart-panel { transform: translateX(0); }
body.cart-open { overflow: hidden; }

.cart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 24px;
  border-bottom: 1px solid var(--border);
}
.cart-header h2 { margin: 0; font-size: 1.2rem; }
.cart-close {
  background: none;
  border: 0;
  font-size: 1.4rem;
  line-height: 1;
  color: var(--text-muted);
  padding: 4px;
}
.cart-close:hover { color: var(--brown-dark); }

.cart-empty { padding: 40px 24px; text-align: center; color: var(--text-muted); }

.cart-items {
  list-style: none;
  margin: 0;
  padding: 4px 24px;
  overflow-y: auto;
  flex: 1;
  display: grid;
  gap: 18px;
}
.cart-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.cart-item-info { display: grid; gap: 4px; }
.cart-item-name { font-weight: 600; font-size: 0.92rem; color: var(--ink); }
.cart-item-price { font-size: 0.8rem; color: var(--text-muted); }
.cart-item-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.qty-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--ink);
  font-size: 1rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.qty-btn:hover { border-color: var(--brown); color: var(--brown); }
.qty-value { min-width: 16px; text-align: center; font-size: 0.9rem; }
.cart-remove {
  background: none;
  border: 0;
  color: var(--text-muted);
  font-size: 1.1rem;
  padding: 2px 4px;
  margin-left: 4px;
}
.cart-remove:hover { color: var(--brown-dark); }

.cart-footer {
  padding: 20px 24px 24px;
  border-top: 1px solid var(--border);
  display: grid;
  gap: 14px;
}
.cart-total {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--ink);
}
.cart-checkout { width: 100%; text-align: center; border: none; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  min-height: 520px;
  display: flex;
  align-items: center;
  overflow: hidden;
}
.hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(46,36,25,0.15), rgba(46,36,25,0.45));
}
.hero--small { min-height: 220px; }
.hero .container { position: relative; z-index: 1; }
.hero-text {
  max-width: 620px;
}
.hero-badge {
  display: inline-block;
  background: rgba(250, 246, 239, 0.9);
  color: var(--brown-dark);
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 1.6rem;
  font-family: var(--font-heading);
  font-weight: 600;
  margin-bottom: 14px;
}
.hero-btn { display: inline-block; }

/* ---------- sections ---------- */
.section { padding: 72px 0; }
.section--cream { background: var(--cream); }
.section-head { text-align: center; max-width: 680px; margin: 0 auto 44px; }
.section-head h2 { font-size: 2.3rem; }
.section-head .btn { margin-top: 8px; }

.intro-block {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
}
.intro-block img,
.intro-block .img-placeholder {
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.intro-block img {
  width: 100%;
  height: auto;
  aspect-ratio: 4/3;
  object-fit: cover;
}
#o-mne .intro-block img { aspect-ratio: 3/4; object-position: center top; }
#o-mne .intro-block p:not(.script) { text-align: justify; }
.text-justify p { text-align: justify; }
#o-mne .intro-block p a {
  color: var(--brown);
  text-decoration: underline;
}
#o-mne .intro-block .script { font-size: 1.3rem; margin-top: 6px; }
.img-placeholder {
  aspect-ratio: 4/3;
  background: url('/assets/img/loofah-texture.svg') center/cover no-repeat;
  display: flex;
  align-items: flex-end;
  padding: 20px;
}
.img-placeholder span {
  background: rgba(250, 246, 239, 0.92);
  color: var(--brown-dark);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
}

.product-intro {
  max-width: 760px;
  margin: 0 auto 48px;
}
.product-intro h3 {
  text-align: center;
  font-size: 1.3rem;
  margin-bottom: 20px;
}
.product-intro p { color: var(--text); }

/* ---------- legal pages ---------- */
.legal-content { max-width: 760px; margin: 0 auto; color: var(--text); }
.legal-content > p { text-align: justify; }
.legal-content h2 { font-size: 1.3rem; margin-top: 2em; }
.legal-content ul { margin: 0 0 1em; padding-left: 1.4em; list-style: disc; }
.legal-content li { margin-bottom: 0.5em; }
.legal-content a:not(.btn) { color: var(--brown); text-decoration: underline; }
.legal-form-box {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin: 1.5em 0;
}
.legal-form-box p { font-size: 0.92rem; }
.legal-form-box p:last-child { margin-bottom: 0; }
.legal-form-title { font-weight: 700; color: var(--ink); font-size: 1.02rem; }
.legal-form-submit { display: inline-block; margin-top: 4px; border: none; }
.legal-form-box form { display: grid; gap: 16px; margin: 18px 0; }
.legal-form-box .form-note { margin: 4px 0 0; }
.legal-form-alt { font-size: 0.92rem; }
.legal-form-success {
  background: rgba(122, 139, 82, 0.15);
  color: var(--sage-dark);
  border-radius: 10px;
  padding: 14px 16px;
  font-weight: 600;
  margin: 18px 0;
}

/* ---------- products ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.product-more { text-align: center; margin-top: 40px; }
.product-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}
.product-card--featured { border: 2px solid var(--sage); }
.product-card--featured .product-img span { background: var(--sage-dark); color: var(--white); }
.product-card--featured .product-price { color: var(--sage-dark); }
.product-card--featured .btn--outline { border-color: var(--sage); color: var(--sage-dark); }
.product-card--featured .btn--outline:hover { background: var(--sage-dark); color: var(--white); }
.product-img {
  display: block;
  position: relative;
  aspect-ratio: 4/3;
  background: url('/assets/img/loofah-texture.svg') center/cover no-repeat;
  overflow: hidden;
}
.product-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.product-img span {
  position: absolute;
  left: 16px;
  bottom: 16px;
  background: rgba(250, 246, 239, 0.92);
  color: var(--brown-dark);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
}
.product-body {
  padding: 22px 22px 26px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.product-body h3 { font-size: 1.15rem; margin-bottom: 0.25em; }
.product-body h3 a:hover { color: var(--brown); }
.product-dim {
  display: block;
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.product-body p {
  color: var(--text-muted);
  font-size: 0.92rem;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.product-price {
  display: block;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--brown);
  margin: 6px 0 14px;
}
.product-card .btn { align-self: flex-start; padding: 11px 26px; font-size: 0.88rem; }

/* ---------- note list ---------- */
.note-list {
  max-width: 760px;
  margin: 40px auto 0;
  color: var(--text-muted);
}
.note-list li { margin-bottom: 0.9em; padding-left: 26px; position: relative; }
.note-list li::before {
  content: '✓';
  position: absolute; left: 0; top: 0;
  color: var(--brown);
  font-weight: 700;
}

/* ---------- gallery ---------- */
.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  margin: 40px auto 0;
  max-width: 900px;
}
.gallery img {
  width: calc((100% - 32px) / 3);
  height: auto;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: zoom-in;
}

/* ---------- recenze ---------- */
.review-root { max-width: 600px; margin: 0 auto; }
.review-intro { margin-bottom: 28px; }
.review-item {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
}
.review-item h3 { font-size: 1.1rem; margin-bottom: 10px; }
.star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; margin-bottom: 12px; }
.star-rating input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.star-rating label { font-size: 1.9rem; color: var(--border); cursor: pointer; line-height: 1; }
.star-rating label:hover,
.star-rating label:hover ~ label,
.star-rating input:checked ~ label { color: var(--brown); }
.star-rating input:focus-visible + label { outline: 2px solid var(--brown); outline-offset: 2px; }
.review-item textarea {
  width: 100%;
  min-height: 70px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.92rem;
  color: var(--text);
  resize: vertical;
}
.review-success {
  background: rgba(122, 139, 82, 0.15);
  color: var(--sage-dark);
  border-radius: 10px;
  padding: 16px 18px;
  font-weight: 600;
}
.review-error { color: #b5442e; margin-top: 12px; }

.reviews-summary { color: var(--brown); font-weight: 600; margin-bottom: 20px; }
.review-card {
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
}
.review-card:last-child { border-bottom: none; }
.review-card-stars { color: var(--brown); letter-spacing: 2px; margin-bottom: 6px; }
.review-card-empty { color: var(--border); }
.review-card p { margin: 0 0 6px; color: var(--text); }
.review-card p.review-card-author { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
.review-card p.review-card-author a { text-decoration: underline; }

/* ---------- FAQ ---------- */
.faq-list {
  max-width: 760px;
  margin: 40px auto 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.faq-item h3 { font-size: 1.08rem; margin-bottom: 6px; }
.faq-item p { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

/* ---------- lightbox ---------- */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(46, 36, 25, 0.92);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.lightbox.is-open { opacity: 1; pointer-events: auto; }
body.lightbox-open { overflow: hidden; }
.lightbox img {
  max-width: min(90vw, 900px);
  max-height: 82vh;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.lightbox-close,
.lightbox-prev,
.lightbox-next {
  position: absolute;
  background: rgba(250, 246, 239, 0.15);
  border: 0;
  color: var(--white);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover { background: rgba(250, 246, 239, 0.3); }
.lightbox-close {
  top: 20px; right: 20px;
  width: 40px; height: 40px;
  font-size: 1.5rem;
}
.lightbox-prev,
.lightbox-next {
  top: 50%;
  transform: translateY(-50%);
  width: 48px; height: 48px;
  font-size: 1.8rem;
}
.lightbox-prev { left: 16px; }
.lightbox-next { right: 16px; }

/* ---------- callout ---------- */
.callout {
  max-width: 640px;
  margin: 48px auto 0;
  text-align: center;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 36px;
}
.callout p:first-child { color: var(--text); }
.callout .script { font-size: 1.4rem; margin-bottom: 4px; }
.callout .btn { margin-top: 16px; }

/* ---------- subtle green accent (from the loofah plant photo) ---------- */
#o-houbickach .eyebrow { color: var(--sage-dark); }
#o-houbickach .note-list li::before { color: var(--sage-dark); }
#o-houbickach .callout { border-color: var(--sage); border-top: 3px solid var(--sage); }
#o-houbickach .callout .script { color: var(--sage-dark); }

/* ---------- contact ---------- */
.contact-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 32px;
  align-items: start;
}
.contact-grid > * { min-width: 0; }
.contact-form {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  display: grid;
  gap: 18px;
}
.form-group { display: grid; gap: 6px; min-width: 0; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; min-width: 0; }
.form-group label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink);
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  min-width: 0;
  font-family: inherit;
  font-size: 0.95rem;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text);
}
.form-group textarea { resize: vertical; min-height: 120px; }
.contact-form input[type="text"],
.contact-form input[type="email"] { max-width: 400px; }
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--brown);
}
.contact-form .btn {
  justify-self: start;
  width: 100%;
  max-width: 400px;
  text-align: center;
  border: none;
}
.form-note {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin: 0;
}
.contact-info {
  background: var(--brown);
  color: var(--cream);
  border-radius: var(--radius);
  padding: 32px;
}
.contact-info h3 { color: var(--white); }
.contact-info p { color: var(--white); }
.contact-info .email {
  display: block;
  width: fit-content;
  margin-top: 6px;
  margin-bottom: 12px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--white);
  border-bottom: 2px solid var(--cream);
}
.contact-info .email:last-of-type { margin-bottom: 24px; }
.contact-info p a { color: var(--white); font-weight: 600; text-decoration: underline; }
.contact-info .script { display: block; font-size: 1.6rem; margin-bottom: 10px; color: var(--cream-dark); }

.map-embed {
  margin-top: 40px;
  border-radius: var(--radius);
  overflow: hidden;

.discount-form { margin: 0 0 24px; }

}

.stock-toast {
  position: fixed;

  left: 50%;
  z-index: 300;

  text-align: center;

.option-group { display: grid; gap: 12px; margin-bottom: 8px; }

.back-link {

.back-link:hover { color: var(--brown-dark); }

.product-detail {

.qty-stepper {

.qty-stepper input {

}
.qty-stepper input::-webkit-outer-spin-button,
.qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty-stepper input:disabled { color: var(--text-muted); }

.add-to-cart-row { display: flex; align-items: center; flex-wrap: nowrap; gap: 10px; margin-top: 4px; }
.product-card .add-to-cart-row { margin-bottom: 4px; }

[data-add-to-cart]:disabled:hover { background: transparent; color: var(--brown); }

/* ---------- upozornění na naskladnění ---------- */
.stock-notify { margin-top: 10px; }
.stock-notify-form { display: flex; gap: 10px; flex-wrap: wrap; }
.stock-notify-form input[type="email"] {
  flex: 1 1 200px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--text);
}
.stock-notify-success { color: var(--sage-dark); font-weight: 600; margin: 4px 0 0; }

/* ---------- scroll reveal ---------- */
.fade-in-section {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.fade-in-section.is-visible { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {

/* ---------- responsive ---------- */
@media (max-width: 860px) {

            <label for="editor-stock">Sklad (ks)</label>
            <input type="number" id="editor-stock" min="0">
          </div>
          <div class="form-group" style="margin-top:14px;">
            <label for="editor-teaser">Krátká věta na kartičku (přehled produktů)</label>
            <input type="text" id="editor-teaser" class="wide" maxlength="150" placeholder="Např. Spolehlivá při mytí nádobí, padne dobře i do menší ruky.">
          </div>
          <textarea id="editor-description" placeholder="Celý popis produktu na jeho vlastní stránce" class="editor-description-input" rows="6" maxlength="1000"></textarea>
          <p class="status-msg" id="editor-description-count" style="text-align:right;"></p>
          <p class="status-msg" id="editor-msg"></p>
          <div class="modal-actions" style="justify-content:flex-start;margin-top:16px;">
            <button type="button" class="btn" id="editor-save">Uložit</button>
            <button type="button" class="btn btn--outline" id="editor-cancel">Zrušit</button>
          </div>
        </div>
      </div>

      <div>
        <h2>Další fotky</h2>
        <div class="gallery editor-gallery" id="editor-gallery"></div>
        <input type="file" id="editor-gallery-input" accept="image/*" hidden>
      </div>
    </div>
  </section>

  <section id="tab-discounts" hidden>
    <div class="table-scroll">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Kód</th>
          <th>Typ</th>
          <th>Hodnota</th>
          <th>Aktivní</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="discounts-tbody"></tbody>
    </table>
    </div>

    <form class="add-product-form" id="add-discount-form">
      <div class="form-group">
        <label for="new-discount-code">Kód</label>
        <input type="text" id="new-discount-code" placeholder="LETO25" required>
      </div>
      <div class="form-group">
        <label for="new-discount-type">Typ</label>
        <select id="new-discount-type">
          <option value="percent">Procenta</option>
          <option value="fixed">Pevná částka (Kč)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="new-discount-value">Hodnota</label>
        <input type="number" id="new-discount-value" min="0" required>
      </div>
      <button type="submit" class="btn">Přidat kód</button>
    </form>
    <p class="status-msg" id="add-discount-msg"></p>

    <h3 style="margin-top:32px;">Doprava zdarma</h3>
    <div class="add-product-form">
      <div class="form-group">
        <label><input type="checkbox" id="free-shipping-active"> Aktivní</label>
      </div>
      <div class="form-group">
        <label for="free-shipping-threshold">Od částky (Kč)</label>
        <input type="number" id="free-shipping-threshold" min="0">
      </div>
      <button type="button" class="btn" id="save-shipping-settings">Uložit</button>
    </div>
    <p class="status-msg" id="shipping-settings-msg"></p>
  </section>

  <section id="tab-reviews" hidden>
    <div class="table-scroll">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Produkt</th>
          <th>Zákazník</th>
          <th>Hodnocení</th>
          <th>Komentář</th>
          <th>Stav</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="reviews-tbody"></tbody>
    </table>
    </div>
    <p id="reviews-empty" class="status-msg" hidden>Zatím žádné recenze.</p>
  </section>
</main>

<script>
(function () {
  var API_BASE = 'https://lufactory-api.gabriela-janyskova.workers.dev';
  var TOKEN_KEY = 'lufactory_admin_token';

  // Musí zůstat stejné jako ORDER_STATUS_LABELS ve worker/src/index.js —
  // klíč "hotovo" navíc spouští na workeru odeslání odkazu na recenzi.
  var ORDER_STATUSES = [
    ['nova', 'Nová'],
    ['zaplaceno', 'Zaplaceno'],
    ['odeslano', 'Odesláno'],
    ['hotovo', 'Vyřízeno'],
    ['zruseno', 'Zrušeno']
  ];

  // Musí zůstat stejné jako SHIPPING ve worker/src/index.js.
  var SHIPPING_LABELS = {
    pickup: 'Osobní odběr',
    'zasilkovna-pickup': 'Zásilkovna – výdejní místo',
    'zasilkovna-address': 'Zásilkovna – doručení na adresu',
    'ppl-pickup': 'PPL – výdejní místo',
    'ppl-address': 'PPL – doručení na adresu'
  };

  function getToken() {
    return localStorage.getItem(TOKEN_KEY) || '';
  }

  function authHeaders() {
    return { Authorization: 'Bearer ' + getToken(), 'Content-Type': 'application/json' };
  }

  // Recenze přichází od zákazníků přes veřejný formulář — nikdy jim nevěřit
  // a před vložením do innerHTML je escapovat.
  function escapeHtml(value) {
    var div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function showApp() {
    document.getElementById('admin-login').hidden = true;
    document.getElementById('admin-app').hidden = false;
    document.getElementById('logout-btn').hidden = false;
    loadOrders();
    loadProducts();
  }

  function showLogin(message) {
    document.getElementById('admin-login').hidden = false;
    document.getElementById('admin-app').hidden = true;
    document.getElementById('logout-btn').hidden = true;
    document.getElementById('login-error').textContent = message || '';
  }

  document.getElementById('login-btn').addEventListener('click', function () {
    var password = document.getElementById('admin-password').value;
    if (!password) return;
    fetch(API_BASE + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok && res.data.ok) {
          localStorage.setItem(TOKEN_KEY, password);
          showApp();
        } else {
          showLogin('Nesprávné heslo.');
        }
      })
      .catch(function () { showLogin('Přihlášení se nezdařilo, zkuste to znovu.'); });
  });

  document.getElementById('admin-password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });

  document.getElementById('logout-btn').addEventListener('click', function () {
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
  });

  document.querySelectorAll('.admin-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.admin-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('tab-orders').hidden = tab.dataset.tab !== 'orders';
      document.getElementById('tab-products').hidden = tab.dataset.tab !== 'products';
      document.getElementById('tab-discounts').hidden = tab.dataset.tab !== 'discounts';
      document.getElementById('tab-reviews').hidden = tab.dataset.tab !== 'reviews';
      if (tab.dataset.tab === 'discounts') { loadDiscounts(); loadShippingSettings(); }
      if (tab.dataset.tab === 'reviews') loadReviews();
    });
  });

  function formatPrice(n) {
    return n.toLocaleString('cs-CZ') + ' Kč';
  }

  document.getElementById('export-orders-csv').addEventListener('click', function (btn) {
    var button = document.getElementById('export-orders-csv');
    button.textContent = 'Připravuji…';
    fetch(API_BASE + '/api/admin/orders-export.csv', { headers: authHeaders() })
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'objednavky.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      })
      .finally(function () { button.textContent = 'Export do CSV'; });
  });

  function loadOrders() {
    fetch(API_BASE + '/api/admin/orders', { headers: authHeaders() })
      .then(function (r) {
        if (r.status === 401) { showLogin('Heslo už neplatí, přihlaste se znovu.'); throw new Error('unauthorized'); }
        return r.json();
      })
      .then(function (data) {
        var tbody = document.getElementById('orders-tbody');
        var empty = document.getElementById('orders-empty');
        tbody.innerHTML = '';
        if (!data.orders || data.orders.length === 0) {
          empty.hidden = false;
          return;
        }
        empty.hidden = true;
        data.orders.forEach(function (order) {
          var tr = document.createElement('tr');

          var itemsHtml = '<div class="order-items-list">' + order.items.map(function (i) {
            return '<div class="order-item-row"><span class="nowrap-cell">' + i.title + '</span><span class="order-item-qty">' + i.qty + ' ks</span></div>';
          }).join('') + '</div>';

          var statusOptions = ORDER_STATUSES.map(function (s) {
            return '<option value="' + s[0] + '"' + (s[0] === order.status ? ' selected' : '') + '>' + s[1] + '</option>';
          }).join('');

          var shippingLabel = SHIPPING_LABELS[order.delivery_method] || order.delivery_method;

          tr.innerHTML =
            '<td class="nowrap-cell">' + order.order_number + '</td>' +
            '<td class="nowrap-cell">' + (order.variable_symbol || '') + '</td>' +
            '<td class="nowrap-cell">' + (order.created_at || '').replace('T', ' ').slice(0, 16) + '</td>' +
            '<td>' + order.customer_name + '<br><small>' +
              order.customer_street + ', ' + order.customer_zip + ' ' + order.customer_city + '<br>' +
              order.customer_email + '<br>' + (order.customer_phone || '') + '</small></td>' +
            '<td>' + itemsHtml + '</td>' +
            '<td>' + shippingLabel + (order.delivery_detail ? '<br><small>' + order.delivery_detail + '</small>' : '') +
              (order.packeta_error ? '<br><small style="color:#b5442e;">Zásilkovna: ' + escapeHtml(order.packeta_error) + '</small>' : '') +
            '</td>' +
            '<td>' + formatPrice(order.total) + '</td>' +
            '<td><select data-order-id="' + order.id + '">' + statusOptions + '</select></td>' +
            '<td><div class="order-actions">' +
              '<button type="button" class="btn btn--outline save-btn" data-invoice-order="' + order.id + '" data-invoice-number="' + order.order_number + '">Faktura</button>' +
              (order.packeta_id
                ? '<button type="button" class="btn btn--outline save-btn" data-label-order="' + order.id + '">Štítek</button>'
                : (order.delivery_method.indexOf('zasilkovna-') === 0
                    ? '<button type="button" class="btn btn--outline save-btn" data-shipment-order="' + order.id + '">Vytvořit zásilku</button>'
                    : '')) +
              '<button type="button" class="icon-btn-delete" data-delete-order="' + order.id + '" title="Smazat objednávku">✕</button>' +
            '</div></td>';

          tbody.appendChild(tr);
        });

        tbody.querySelectorAll('button[data-invoice-order]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            btn.textContent = 'Načítám…';
            fetch(API_BASE + '/api/admin/orders/' + btn.dataset.invoiceOrder + '/invoice', { headers: authHeaders() })
              .then(function (r) { return r.blob(); })
              .then(function (blob) {
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
              })
              .finally(function () { btn.textContent = 'Faktura'; });
          });
        });

        tbody.querySelectorAll('button[data-label-order]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            btn.textContent = 'Načítám…';
            fetch(API_BASE + '/api/admin/orders/' + btn.dataset.labelOrder + '/label', { headers: authHeaders() })
              .then(function (r) { return r.blob(); })
              .then(function (blob) {
                var url = URL.createObjectURL(blob);
                window.open(url, '_blank');
              })
              .finally(function () { btn.textContent = 'Štítek'; });
          });
        });

        tbody.querySelectorAll('button[data-shipment-order]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            btn.disabled = true;
            btn.textContent = 'Vytvářím…';
            fetch(API_BASE + '/api/admin/orders/' + btn.dataset.shipmentOrder + '/shipment', {
              method: 'POST',
              headers: authHeaders()
            })
              .then(function (r) { return r.json(); })
              .then(function () { loadOrders(); })
              .catch(function () {
                btn.disabled = false;
                btn.textContent = 'Vytvořit zásilku';
              });
          });
        });

        tbody.querySelectorAll('button[data-delete-order]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (!confirm('Opravdu smazat tuhle objednávku? Nejde vrátit zpět.')) return;
            fetch(API_BASE + '/api/admin/orders/' + btn.dataset.deleteOrder, {
              method: 'DELETE',
              headers: authHeaders()
            }).then(function () { loadOrders(); });
          });
        });

        tbody.querySelectorAll('select[data-order-id]').forEach(function (select) {
          select.addEventListener('change', function () {
            fetch(API_BASE + '/api/admin/orders/' + select.dataset.orderId, {
              method: 'PATCH',
              headers: authHeaders(),
              body: JSON.stringify({ status: select.value })
            });
          });
        });
      })
      .catch(function () {});
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function uploadProductPhoto(productId, file, target) {
    return fileToBase64(file).then(function (base64) {
      return fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(productId) + '/image', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ contentBase64: base64, contentType: file.type, target: target })
      });
    });
  }

  var currentProducts = {};
  var modalMode = 'new';
  var modalProductId = null;
  var modalPhotoFile = null;
  var editorGalleryUrls = [];
  var editorMainImageUrl = '';

  function loadProducts() {
    fetch(API_BASE + '/api/products')
      .then(function (r) { return r.json(); })
      .then(function (products) {
        currentProducts = products;
        var grid = document.getElementById('products-cards');
        grid.innerHTML = '';
        Object.keys(products).forEach(function (productId) {
          var p = products[productId];

          var card = document.createElement('div');
          card.className = 'product-admin-card';
          card.innerHTML =
            '<div class="product-admin-card-body">' +
              '<h4>' + p.title + '</h4>' +
              '<p>' + p.price + ' Kč</p>' +
            '</div>' +
            '<div class="admin-stock-control' + (p.stockQty > 0 ? '' : ' stock-empty') + '">' +
              '<button type="button" data-stock-dec aria-label="Ubrat kus">−</button>' +
              '<input type="number" min="0" value="' + p.stockQty + '" data-stock-input aria-label="Počet kusů skladem">' +
              '<button type="button" data-stock-inc aria-label="Přidat kus">+</button>' +
            '</div>' +
            '<button type="button" class="gallery-remove-btn product-admin-card-delete" title="Smazat produkt">✕</button>';
          card.addEventListener('click', function () { openProductEditor(productId); });

          var stockInput = card.querySelector('[data-stock-input]');
          var stockControl = card.querySelector('.admin-stock-control');
          function saveStock(newQty) {
            newQty = Math.max(0, newQty);
            stockInput.value = newQty;
            stockControl.classList.toggle('stock-empty', newQty === 0);
            currentProducts[productId].stockQty = newQty;
            fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(productId), {
              method: 'PATCH',
              headers: authHeaders(),
              body: JSON.stringify({ stockQty: newQty })
            });
          }
          card.querySelector('[data-stock-dec]').addEventListener('click', function (e) {
            e.stopPropagation();
            saveStock((parseInt(stockInput.value, 10) || 0) - 1);
          });
          card.querySelector('[data-stock-inc]').addEventListener('click', function (e) {
            e.stopPropagation();
            saveStock((parseInt(stockInput.value, 10) || 0) + 1);
          });
          stockInput.addEventListener('click', function (e) { e.stopPropagation(); });
          stockInput.addEventListener('change', function () {
            saveStock(parseInt(stockInput.value, 10) || 0);
          });

          card.querySelector('.product-admin-card-delete').addEventListener('click', function (e) {
            e.stopPropagation();
            if (!confirm('Opravdu smazat produkt "' + p.title + '"? Nejde vrátit zpět.')) return;
            fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(productId), {
              method: 'DELETE',
              headers: authHeaders()
            }).then(function () { loadProducts(); });
          });
          grid.appendChild(card);
        });
      });
  }

  function openProductEditor(productId) {
    modalMode = productId ? 'edit' : 'new';
    modalProductId = productId;
    modalPhotoFile = null;
    document.getElementById('editor-photo-input').value = '';

    var idInput = document.getElementById('editor-id');
    var img = document.getElementById('editor-img');
    var placeholder = document.getElementById('editor-img-placeholder');
    var stockBadge = document.getElementById('editor-stock-badge');

    if (modalMode === 'edit') {
      var p = currentProducts[productId];
      idInput.value = productId;
      idInput.disabled = true;
      document.getElementById('editor-id-group').hidden = true;
      document.getElementById('editor-title').value = p.title;
      document.getElementById('editor-description').value = p.description || '';
      document.getElementById('editor-teaser').value = p.teaser || '';
      document.getElementById('editor-price').value = p.price;
      document.getElementById('editor-stock').value = p.stockQty;
      editorMainImageUrl = p.imageUrl || '';
      if (p.imageUrl) { img.src = p.imageUrl; img.hidden = false; placeholder.hidden = true; }
      else { img.hidden = true; placeholder.hidden = false; }
      stockBadge.textContent = p.stockQty > 0 ? 'Skladem: ' + p.stockQty + ' ks' : 'Není skladem';
      stockBadge.className = 'stock-badge ' + (p.stockQty > 0 ? 'stock-badge--in' : 'stock-badge--out');
      editorGalleryUrls = (p.galleryUrls || []).slice();
    } else {
      editorMainImageUrl = '';
      idInput.value = '';
      idInput.disabled = false;
      document.getElementById('editor-id-group').hidden = false;
      document.getElementById('editor-title').value = '';
      document.getElementById('editor-description').value = '';
      document.getElementById('editor-teaser').value = '';
      document.getElementById('editor-price').value = '';
      document.getElementById('editor-stock').value = '0';
      img.hidden = true;
      placeholder.hidden = false;
      stockBadge.textContent = 'Není skladem';
      stockBadge.className = 'stock-badge stock-badge--out';
      editorGalleryUrls = [];
    }

    renderEditorGallery();
    updateDescriptionCount();
    document.getElementById('editor-msg').textContent = '';
    document.getElementById('products-list-view').hidden = true;
    document.getElementById('product-editor').hidden = false;
  }

  function renderEditorGallery() {
    var gallery = document.getElementById('editor-gallery');
    gallery.innerHTML = '';
    editorGalleryUrls.forEach(function (url, index) {
      var item = document.createElement('div');
      item.className = 'editor-gallery-item';
      item.innerHTML =
        '<img src="' + url + '" alt="" title="Nastavit jako hlavní fotku">' +
        '<button type="button" class="gallery-remove-btn" title="Smazat fotku">✕</button>';
      item.querySelector('img').addEventListener('click', function () {
        setAsMainImage(index);
      });
      item.querySelector('.gallery-remove-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        editorGalleryUrls.splice(index, 1);
        saveGalleryUrls();
      });
      gallery.appendChild(item);
    });

    if (modalMode === 'edit') {
      var addTile = document.createElement('button');
      addTile.type = 'button';
      addTile.className = 'editor-gallery-add';
      addTile.textContent = '+ Přidat fotku';
      addTile.addEventListener('click', function () {
        document.getElementById('editor-gallery-input').click();
      });
      gallery.appendChild(addTile);
    }
  }

  function saveGalleryUrls() {
    return fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(modalProductId), {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({ galleryUrls: editorGalleryUrls })
    }).then(function () { renderEditorGallery(); });
  }

  function setAsMainImage(galleryIndex) {
    var newMain = editorGalleryUrls[galleryIndex];
    var oldMain = editorMainImageUrl;
    editorGalleryUrls.splice(galleryIndex, 1);
    if (oldMain) editorGalleryUrls.push(oldMain);
    editorMainImageUrl = newMain;

    var img = document.getElementById('editor-img');
    img.src = newMain;
    img.hidden = false;
    document.getElementById('editor-img-placeholder').hidden = true;

    return fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(modalProductId), {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({ imageUrl: newMain, galleryUrls: editorGalleryUrls })
    }).then(function () { renderEditorGallery(); });
  }

  document.getElementById('editor-gallery-input').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file || !modalProductId) return;
    uploadProductPhoto(modalProductId, file, 'gallery')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        editorGalleryUrls.push(data.imageUrl);
        renderEditorGallery();
      });
    e.target.value = '';
  });

  function closeProductEditor() {
    document.getElementById('product-editor').hidden = true;
    document.getElementById('products-list-view').hidden = false;
  }

  document.getElementById('open-add-product').addEventListener('click', function () {
    openProductEditor(null);
  });
  document.getElementById('editor-cancel').addEventListener('click', closeProductEditor);
  document.getElementById('editor-back').addEventListener('click', function (e) {
    e.preventDefault();
    closeProductEditor();
  });

  document.getElementById('editor-photo-input').addEventListener('change', function (e) {
    modalPhotoFile = e.target.files[0] || null;
    if (!modalPhotoFile) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = document.getElementById('editor-img');
      img.src = reader.result;
      img.hidden = false;
      document.getElementById('editor-img-placeholder').hidden = true;
    };
    reader.readAsDataURL(modalPhotoFile);
  });

  var descriptionInput = document.getElementById('editor-description');
  var descriptionCount = document.getElementById('editor-description-count');
  function updateDescriptionCount() {
    descriptionCount.textContent = descriptionInput.value.length + ' / 1000 znaků';
  }
  descriptionInput.addEventListener('input', updateDescriptionCount);

  document.getElementById('editor-save').addEventListener('click', function () {
    var msg = document.getElementById('editor-msg');
    var saveBtn = document.getElementById('editor-save');
    var payload = {
      title: document.getElementById('editor-title').value.trim(),
      description: document.getElementById('editor-description').value.trim(),
      teaser: document.getElementById('editor-teaser').value.trim(),
      price: Number(document.getElementById('editor-price').value),
      stockQty: Number(document.getElementById('editor-stock').value) || 0
    };

    var productId = modalMode === 'new' ? document.getElementById('editor-id').value.trim() : modalProductId;
    if (!productId || !payload.title || payload.price == null || isNaN(payload.price)) {
      msg.textContent = 'Vyplňte aspoň ID, název a cenu.';
      msg.className = 'status-msg err';
      return;
    }

    saveBtn.textContent = 'Ukládám…';
    var request = modalMode === 'new'
      ? fetch(API_BASE + '/api/admin/products', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(Object.assign({ productId: productId }, payload))
        })
      : fetch(API_BASE + '/api/admin/products/' + encodeURIComponent(productId), {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify(payload)
        });

    request
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.data.error || 'chyba');
        return modalPhotoFile ? uploadProductPhoto(productId, modalPhotoFile) : null;
      })
      .then(function () {
        saveBtn.textContent = 'Uložit';
        closeProductEditor();
        loadProducts();
      })
      .catch(function (err) {
        saveBtn.textContent = 'Uložit';
        msg.textContent = 'Nepodařilo se uložit (' + err.message + ').';
        msg.className = 'status-msg err';
      });
  });

  function loadDiscounts() {
    fetch(API_BASE + '/api/admin/discounts', { headers: authHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var tbody = document.getElementById('discounts-tbody');
        tbody.innerHTML = '';
        (data.codes || []).forEach(function (d) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + d.code + '</td>' +
            '<td>' + (d.type === 'percent' ? 'Procenta' : 'Pevná částka') + '</td>' +
            '<td>' + d.value + (d.type === 'percent' ? ' %' : ' Kč') + '</td>' +
            '<td><input type="checkbox" data-field="active" ' + (d.active ? 'checked' : '') + '></td>' +
            '<td><button type="button" class="cart-remove" data-delete-discount="' + d.code + '" title="Smazat kód">✕</button></td>';
          tr.dataset.code = d.code;
          tbody.appendChild(tr);
        });

        tbody.querySelectorAll('input[data-field="active"]').forEach(function (checkbox) {
          checkbox.addEventListener('change', function () {
            var code = checkbox.closest('tr').dataset.code;
            fetch(API_BASE + '/api/admin/discounts/' + encodeURIComponent(code), {
              method: 'PATCH',
              headers: authHeaders(),
              body: JSON.stringify({ active: checkbox.checked })
            });
          });
        });

        tbody.querySelectorAll('button[data-delete-discount]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (!confirm('Smazat tenhle slevový kód?')) return;
            fetch(API_BASE + '/api/admin/discounts/' + encodeURIComponent(btn.dataset.deleteDiscount), {
              method: 'DELETE',
              headers: authHeaders()
            }).then(function () { loadDiscounts(); });
          });
        });
      });
  }

  document.getElementById('add-discount-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = document.getElementById('add-discount-msg');
    var payload = {
      code: document.getElementById('new-discount-code').value.trim(),
      type: document.getElementById('new-discount-type').value,
      value: Number(document.getElementById('new-discount-value').value)
    };
    fetch(API_BASE + '/api/admin/discounts', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok) {
          msg.textContent = 'Kód přidán.';
          msg.className = 'status-msg ok';
          document.getElementById('add-discount-form').reset();
          loadDiscounts();
        } else {
          msg.textContent = 'Nepodařilo se přidat kód (' + (res.data.error || 'chyba') + ').';
          msg.className = 'status-msg err';
        }
      });
  });

  function loadShippingSettings() {
    fetch(API_BASE + '/api/shipping-settings')
      .then(function (r) { return r.json(); })
      .then(function (settings) {
        document.getElementById('free-shipping-active').checked = !!settings.active;
        document.getElementById('free-shipping-threshold').value = settings.threshold || 0;
      });
  }

  document.getElementById('save-shipping-settings').addEventListener('click', function () {
    var msg = document.getElementById('shipping-settings-msg');
    fetch(API_BASE + '/api/admin/shipping-settings', {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({
        active: document.getElementById('free-shipping-active').checked,
        threshold: Number(document.getElementById('free-shipping-threshold').value) || 0
      })
    })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; })
      .then(function (ok) {
        msg.textContent = ok ? 'Uloženo.' : 'Uložení se nepovedlo, zkuste to prosím znovu.';
        msg.className = ok ? 'status-msg ok' : 'status-msg err';
        if (ok) loadShippingSettings();
      });
  });

  function loadReviews() {
    fetch(API_BASE + '/api/admin/reviews', { headers: authHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var reviews = data.reviews || [];
        var tbody = document.getElementById('reviews-tbody');
        tbody.innerHTML = '';
        document.getElementById('reviews-empty').hidden = reviews.length > 0;

        reviews.forEach(function (r) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + escapeHtml(r.product_title || r.product_id) + '</td>' +
            '<td>' + escapeHtml(r.customer_name) + '</td>' +
            '<td>' + '★'.repeat(r.rating) + '<span style="color:var(--border)">' + '★'.repeat(5 - r.rating) + '</span></td>' +
            '<td>' + (r.comment ? escapeHtml(r.comment) : '—') + '</td>' +
            '<td><select data-review-status>' +
              '<option value="pending"' + (r.status === 'pending' ? ' selected' : '') + '>Čeká</option>' +
              '<option value="approved"' + (r.status === 'approved' ? ' selected' : '') + '>Schváleno</option>' +
              '<option value="hidden"' + (r.status === 'hidden' ? ' selected' : '') + '>Skryto</option>' +
            '</select></td>' +
            '<td><button type="button" class="icon-btn-delete" data-delete-review="' + r.id + '" title="Smazat recenzi">✕</button></td>';
          tbody.appendChild(tr);

          tr.querySelector('[data-review-status]').addEventListener('change', function (e) {
            fetch(API_BASE + '/api/admin/reviews/' + r.id, {
              method: 'PATCH',
              headers: authHeaders(),
              body: JSON.stringify({ status: e.target.value })
            });
          });
          tr.querySelector('[data-delete-review]').addEventListener('click', function () {
            if (!confirm('Smazat tuhle recenzi?')) return;
            fetch(API_BASE + '/api/admin/reviews/' + r.id, {
              method: 'DELETE',
              headers: authHeaders()
            }).then(function () { loadReviews(); });
          });
        });
      });
  }

  if (getToken()) {
    showApp();
  } else {
    showLogin();
  }
})();
</script>

</body>
</html>
